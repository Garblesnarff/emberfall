<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMBERFALL</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --coal:#15110c; --char:#211a12; --iron:#3a3026;
    --ember:#ffae42; --hot:#ff5e2b; --whitehot:#ffe9c4;
    --ash:#8a8077; --slag:#4aa3b8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--coal);overflow:hidden;font-family:'JetBrains Mono',monospace;color:var(--whitehot)}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
  .ui{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
  .panel{pointer-events:auto;background:linear-gradient(180deg,rgba(33,26,18,.96),rgba(21,17,12,.98));
    border:1px solid var(--iron);border-top:2px solid var(--ember);
    padding:38px 52px;text-align:center;max-width:720px;
    box-shadow:0 0 80px rgba(255,94,43,.12), 0 20px 60px rgba(0,0,0,.6)}
  h1{font-family:'Cinzel',serif;font-weight:800;font-size:clamp(40px,7vw,72px);letter-spacing:.14em;
    background:linear-gradient(180deg,var(--whitehot) 20%,var(--ember) 55%,var(--hot) 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--ash);font-size:13px;letter-spacing:.22em;text-transform:uppercase;margin-top:6px}
  .keys{margin:24px 0 6px;color:var(--ash);font-size:13px;line-height:2.1}
  .keys b{color:var(--ember);background:rgba(255,174,66,.08);border:1px solid var(--iron);
    padding:1px 8px;border-radius:3px;font-weight:700}
  button{pointer-events:auto;font-family:'Cinzel',serif;font-weight:800;letter-spacing:.18em;
    font-size:17px;color:var(--coal);background:linear-gradient(180deg,var(--ember),var(--hot));
    border:none;padding:14px 46px;margin-top:22px;cursor:pointer;text-transform:uppercase;
    box-shadow:0 0 24px rgba(255,94,43,.35);transition:transform .12s, box-shadow .12s}
  button:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(255,94,43,.55)}
  .cards{display:flex;gap:14px;margin-top:24px}
  .card{pointer-events:auto;flex:1;background:var(--char);border:1px solid var(--iron);
    padding:20px 14px;cursor:pointer;transition:all .15s;min-width:148px;position:relative}
  .card:hover{border-color:var(--ember);transform:translateY(-4px);box-shadow:0 0 30px rgba(255,174,66,.2)}
  .card .icon{font-size:28px;margin-bottom:9px}
  .card .name{font-family:'Cinzel',serif;font-weight:800;font-size:13.5px;letter-spacing:.06em;color:var(--ember);margin-bottom:7px}
  .card .desc{font-size:11.5px;color:var(--ash);line-height:1.5}
  .card .lvl{position:absolute;top:8px;right:10px;font-size:10px;color:var(--ash);letter-spacing:.1em}
  .stat{font-size:13px;color:var(--ash);margin-top:12px;letter-spacing:.1em}
  .stat b{color:var(--whitehot)}
  #hud{position:absolute;top:0;left:0;right:0;padding:16px 22px;pointer-events:none;
    display:flex;justify-content:space-between;align-items:flex-start;font-size:13px}
  .hpwrap{width:230px}
  .hplabel{display:flex;justify-content:space-between;color:var(--ash);font-size:11px;letter-spacing:.18em;margin-bottom:5px}
  .hpbar{height:10px;background:rgba(0,0,0,.5);border:1px solid var(--iron)}
  .hpfill{height:100%;background:linear-gradient(90deg,var(--hot),var(--ember));transition:width .15s}
  .dashbar{height:4px;background:rgba(0,0,0,.5);border:1px solid var(--iron);border-top:none}
  .dashfill{height:100%;background:var(--whitehot);opacity:.7;transition:width .1s}
  .wave{font-family:'Cinzel',serif;font-weight:800;font-size:22px;letter-spacing:.2em;color:var(--ember);text-align:center;text-shadow:0 0 20px rgba(255,174,66,.4)}
  .wavesub{font-size:10px;color:var(--ash);letter-spacing:.3em;text-align:center;margin-top:2px}
  .score{text-align:right;color:var(--ash);font-size:11px;letter-spacing:.18em;line-height:1.8}
  .score b{color:var(--whitehot);font-size:15px}
  #combo{color:var(--ember);font-weight:700;font-size:13px;height:16px}
  #announce{position:absolute;top:24%;left:0;right:0;text-align:center;pointer-events:none;
    font-family:'Cinzel',serif;font-weight:800;font-size:46px;letter-spacing:.3em;color:var(--ember);
    opacity:0;text-shadow:0 0 40px rgba(255,94,43,.6);transition:opacity .4s}
  #fpsTag{position:absolute;bottom:8px;left:10px;font-size:10px;color:rgba(138,128,119,.5);letter-spacing:.1em;pointer-events:none}
  .hidden{display:none!important}
  @media (prefers-reduced-motion: reduce){ button, .card{transition:none} }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="hud" class="hidden">
  <div class="hpwrap">
    <div class="hplabel"><span>FORGE HEART</span><span id="hptext"></span></div>
    <div class="hpbar"><div class="hpfill" id="hpfill"></div></div>
    <div class="dashbar"><div class="dashfill" id="dashfill"></div></div>
  </div>
  <div><div class="wave" id="waveN">WAVE I</div><div class="wavesub" id="waveLeft"></div></div>
  <div class="score">SCORE <b id="score">0</b><br><span id="kills">0</span> PURGED · <span id="best"></span><br><span id="combo"></span></div>
</div>
<div id="announce"></div>
<div id="fpsTag" class="hidden"></div>

<div class="ui" id="menu">
  <div class="panel">
    <h1>EMBERFALL</h1>
    <div class="sub">The forge is breached. Hold the floor.</div>
    <div class="keys">
      <b>WASD</b> move &nbsp; <b>MOUSE</b> aim &nbsp; auto-fire<br>
      <b>SPACE</b> dash through anything &nbsp; <b>P</b> pause &nbsp; <b>M</b> mute
    </div>
    <button id="startBtn">Light the Forge</button>
  </div>
</div>

<div class="ui hidden" id="upgradeUI">
  <div class="panel">
    <h1 style="font-size:32px">WAVE CLEARED</h1>
    <div class="sub">Choose a tempering</div>
    <div class="cards" id="cardRow"></div>
  </div>
</div>

<div class="ui hidden" id="overUI">
  <div class="panel">
    <h1 style="font-size:42px">FORGE COLD</h1>
    <div class="sub">The slag took the floor</div>
    <div class="stat">Waves held: <b id="fWaves"></b> · Slag purged: <b id="fKills"></b> · Score: <b id="fScore"></b></div>
    <div class="stat">Best combo: <b id="fCombo"></b></div>
    <div class="stat" id="fBest"></div>
    <button id="againBtn">Relight the Forge</button>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,1.5); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

// ================= helpers =================
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const dist2=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];
const waveName=w=>ROMAN[w-1]||w;
const $=id=>document.getElementById(id);
const show=(id,on)=>$(id).classList.toggle('hidden',!on);

// ================= glow sprite cache (replaces shadowBlur — huge perf win) =================
const glowCache=new Map();
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function glowSprite(col,r){
  const key=col+'|'+r;
  let s=glowCache.get(key); if(s) return s;
  const size=Math.ceil(r*2.6)*2;
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d'), [R,G,B]=hexRGB(col);
  const grd=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  grd.addColorStop(0,`rgba(${R},${G},${B},.85)`);
  grd.addColorStop(.35,`rgba(${R},${G},${B},.32)`);
  grd.addColorStop(1,`rgba(${R},${G},${B},0)`);
  g.fillStyle=grd; g.fillRect(0,0,size,size);
  glowCache.set(key,c); return c;
}
function drawGlow(col,r,x,y){ const s=glowSprite(col,r); ctx.drawImage(s,x-s.width/2,y-s.height/2); }

// ================= spatial grid (replaces O(n²) collision) =================
const CELL=80; const grid=new Map();
function buildGrid(){
  grid.clear();
  for(let i=0;i<enemies.length;i++){ const e=enemies[i];
    const k=Math.floor(e.x/CELL)+','+Math.floor(e.y/CELL);
    let a=grid.get(k); if(!a){a=[];grid.set(k,a);} a.push(e);
  }
}
const _near=[];
function nearby(x,y,r){
  _near.length=0;
  const x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){
    const a=grid.get(cx+','+cy); if(a) for(let i=0;i<a.length;i++)_near.push(a[i]);
  }
  return _near;
}

// ================= audio (WebAudio synth, no assets) =================
let AC=null, master=null, muted=false, lastShot=0;
function audioInit(){
  if(AC) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=.3; master.connect(AC.destination); }catch(e){}
}
function tone(freq,dur,type,vol,slideTo){
  if(!AC||muted)return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.02);
}
function hiss(dur,vol,freq){
  if(!AC||muted)return;
  const t=AC.currentTime, n=AC.sampleRate*dur|0, buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1200; f.Q.value=.8;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(t);
}
const SFX={
  shoot(){ const now=performance.now(); if(now-lastShot<70)return; lastShot=now; tone(540,.05,'square',.07,260); },
  hit(){ tone(rnd(820,960),.03,'square',.045); },
  kill(){ tone(rnd(170,210),.16,'sawtooth',.16,70); },
  elite(){ tone(120,.3,'sawtooth',.25,50); hiss(.2,.2,500); },
  hurt(){ tone(85,.25,'sawtooth',.3,40); hiss(.15,.25,300); },
  dash(){ hiss(.16,.22,2000); },
  pickup(){ tone(740,.09,'sine',.18,1180); },
  heart(){ tone(520,.1,'sine',.2,780); tone(780,.14,'sine',.15,1040); },
  upgrade(){ [392,494,587,784].forEach((f,i)=>setTimeout(()=>tone(f,.22,'triangle',.18),i*70)); },
  boss(){ tone(55,.9,'sawtooth',.3,38); hiss(.6,.2,200); },
  nova(){ tone(110,.3,'sawtooth',.28,45); hiss(.3,.3,900); },
  over(){ [330,262,196,131].forEach((f,i)=>setTimeout(()=>tone(f,.4,'triangle',.2),i*180)); },
};

// ================= state =================
let state='menu', frame=0, shake=0, hitstop=0, flash=0, annT=0, fps=60, fpsAcc=0, fpsN=0, fpsLast=performance.now();
let keys={}, mouse={x:innerWidth/2,y:innerHeight/2};
let player, bullets=[], ebullets=[], enemies=[], parts=[], dnums=[], drops=[];
let wave=0, kills=0, score=0, combo=0, comboT=0, bestCombo=0, spawnQueue=[], spawnT=0, waveActive=false;
let best=0, bestScore=0;
try{ best=+localStorage.getItem('emberfall_best')||0; bestScore=+localStorage.getItem('emberfall_bestscore')||0; }catch(e){}
let embers=[]; for(let i=0;i<32;i++) embers.push({x:rnd(0,innerWidth),y:rnd(0,innerHeight),s:rnd(.2,.7),r:rnd(.6,1.8),o:rnd(.05,.3)});

const PART_CAP=380, DNUM_CAP=70, EBUL_CAP=320;

addEventListener('keydown',e=>{ keys[e.code]=true;
  if(e.code==='Space') e.preventDefault();
  if(e.code==='KeyP' && (state==='play'||state==='pause')) state = state==='play'?'pause':'play';
  if(e.code==='KeyM'){ muted=!muted; }
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});

// ================= player =================
function newPlayer(){ return {
  x:W/2, y:H/2, r:11, hp:100, maxHp:100, spd:3.3,
  dmg:10, fireRate:11, fireT:0, projSpd:9.5, shots:1, pierce:0,
  dashCd:90, dashT:0, dashing:0, dx:0, dy:0,
  lifesteal:0, nova:false, regen:0, crit:0, burn:false, ricochet:0, orbs:0, orbA:0,
  inv:0, taken:{}
};}

function reset(){
  player=newPlayer(); bullets.length=0; ebullets.length=0; enemies.length=0;
  parts.length=0; dnums.length=0; drops.length=0;
  wave=0; kills=0; score=0; combo=0; comboT=0; bestCombo=0; spawnQueue.length=0; waveActive=false;
  nextWave();
}

// ================= waves =================
function hpScale(w){ return 1 + w*.32 + Math.pow(w,1.6)*.02; }

function nextWave(){
  wave++;
  $('waveN').textContent='WAVE '+waveName(wave);
  const boss = wave%5===0;
  const n = Math.min(8 + Math.floor(wave*2.6), 110);
  spawnQueue.length=0;
  for(let i=0;i<n;i++){
    const r=Math.random(), w=wave;
    let t='crawler';
    if(w>=2 && r<.20) t='spitter';
    else if(w>=3 && r<.34) t='brute';
    else if(w>=4 && r<.46) t='splitter';
    else if(w>=6 && r<.58) t='hound';
    spawnQueue.push(t);
  }
  if(boss) spawnQueue.push('boss');
  spawnT=30; waveActive=true;
  announce('WAVE '+waveName(wave)+(boss?' — SLAGLORD':''));
  if(boss) SFX.boss();
}

function announce(t){ const a=$('announce'); a.textContent=t; a.style.opacity=1; annT=110; }

function spawnEnemy(type,px,py,childOf){
  const side=Math.floor(rnd(0,4));
  let x = px!==undefined?px : side===0?-30 : side===1?W+30 : rnd(0,W);
  let y = py!==undefined?py : side===2?-30 : side===3?H+30 : rnd(0,H);
  const w=wave, f=hpScale(w);
  const e={x,y,type,hitF:0,burnT:0,burnTick:0,orbI:0,elite:false,child:!!childOf};
  if(type==='crawler') Object.assign(e,{r:11,hp:14*f,spd:rnd(1.5,2.0)+Math.min(w*.05,1.4),dmg:8,col:'#ff5e2b',pts:10});
  if(type==='brute')   Object.assign(e,{r:22,hp:62*f,spd:.85+Math.min(w*.025,.8),dmg:18,col:'#c93a1d',pts:25});
  if(type==='spitter') Object.assign(e,{r:13,hp:22*f,spd:1.2,dmg:6,col:'#4aa3b8',fireT:rnd(60,120),pts:20});
  if(type==='splitter')Object.assign(e,{r:17,hp:34*f,spd:1.25,dmg:12,col:'#e0762e',pts:20});
  if(type==='hound')   Object.assign(e,{r:12,hp:26*f,spd:1.7,dmg:14,col:'#ffd23f',pts:25,hstate:0,hT:rnd(50,90)});
  if(type==='boss'){   Object.assign(e,{r:42,hp:430*f,spd:.95,dmg:26,col:'#ff8c1a',fireT:80,pat:0,hstate:0,hT:0,pts:400}); }
  if(childOf){ e.hp*= .45; e.r*= .8; e.pts=5; }
  e.maxHp=e.hp;
  // elites
  if(type!=='boss' && !childOf && Math.random() < Math.min(.03+w*.006,.22)){
    e.elite=true; e.hp*=2.6; e.maxHp=e.hp; e.spd*=1.12; e.r*=1.18; e.dmg*=1.3; e.pts*=4;
  }
  enemies.push(e);
}

// ================= upgrades =================
const UPGRADES=[
  {id:'dmg',  icon:'🔥',name:'Hotter Steel',desc:'+30% damage',max:99,f:p=>p.dmg*=1.30},
  {id:'shots',icon:'⚒️',name:'Twin Hammers',desc:'+1 projectile (slight damage trade)',max:5,f:p=>{p.shots++;p.dmg*=.92}},
  {id:'rate', icon:'💨',name:'Bellows',desc:'+22% fire rate',max:6,f:p=>p.fireRate=Math.max(3,p.fireRate*.78)},
  {id:'spd',  icon:'🦵',name:'Quenched Legs',desc:'+15% move speed',max:4,f:p=>p.spd*=1.15},
  {id:'hp',   icon:'❤️',name:'Reforged Heart',desc:'+30 max HP, heal to full',max:99,f:p=>{p.maxHp+=30;p.hp=p.maxHp}},
  {id:'pierce',icon:'🗡️',name:'Piercing Slag',desc:'Shots pierce +1 enemy',max:4,f:p=>p.pierce++},
  {id:'dash', icon:'⚡',name:'Coiled Spring',desc:'Dash recharges 35% faster',max:3,f:p=>p.dashCd=Math.max(28,p.dashCd*.65)},
  {id:'leech',icon:'🩸',name:'Ember Leech',desc:'Heal 1 HP per kill',max:3,f:p=>p.lifesteal+=1},
  {id:'nova', icon:'💥',name:'Nova Dash',desc:'Dashing detonates a fire nova',max:1,f:p=>p.nova=true},
  {id:'regen',icon:'🌡️',name:'Slow Burn',desc:'Regenerate 1 HP / 2s',max:3,f:p=>p.regen+=1},
  {id:'crit', icon:'✨',name:'Killing Edge',desc:'+15% chance to crit for 2.5×',max:4,f:p=>p.crit+=.15},
  {id:'burn', icon:'☄️',name:'Branding Iron',desc:'Hits ignite enemies (burn over 2s)',max:1,f:p=>p.burn=true},
  {id:'rico', icon:'🔗',name:'Chain Spark',desc:'Shots ricochet to +1 nearby enemy',max:2,f:p=>p.ricochet++},
  {id:'orb',  icon:'🛡️',name:'Orbiting Anvil',desc:'+1 anvil circles you, crushing slag',max:3,f:p=>p.orbs++},
];
function offerUpgrades(){
  state='upgrade'; show('upgradeUI',true);
  const p=player;
  const pool=UPGRADES.filter(u=>(p.taken[u.id]||0)<u.max).sort(()=>Math.random()-.5).slice(0,3);
  const row=$('cardRow'); row.innerHTML='';
  pool.forEach(u=>{
    const lvl=p.taken[u.id]||0;
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<div class="lvl">${lvl?('LV '+lvl):'NEW'}</div><div class="icon">${u.icon}</div><div class="name">${u.name}</div><div class="desc">${u.desc}</div>`;
    d.onclick=()=>{ u.f(p); p.taken[u.id]=(p.taken[u.id]||0)+1; SFX.upgrade();
      show('upgradeUI',false); state='play'; nextWave(); };
    row.appendChild(d);
  });
}

// ================= juice =================
function burst(x,y,col,n,spd,life){
  n=n||14; spd=spd||4; life=life||30;
  for(let i=0;i<n;i++){
    if(parts.length>=PART_CAP) return;
    const a=rnd(0,TAU),s=rnd(.5,spd);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(life*.5,life),max:life,col,r:rnd(1,3)});
  }
}
function dnum(x,y,v,col,big){
  if(dnums.length>=DNUM_CAP) return;
  dnums.push({x,y:y-10,v:Math.round(v),life:40,col:col||'#ffe9c4',big:!!big});
}
function addScore(n){
  const mult=1+Math.floor(combo/8);
  score+=n*mult;
}

// ================= damage =================
function hurtEnemy(e,amount,knx,kny,isCrit){
  e.hp-=amount; e.hitF=5;
  dnum(e.x+rnd(-8,8),e.y,amount,isCrit?'#ffd23f':'#ffe9c4',isCrit);
  if(knx){ const kb=e.type==='boss'?.06:.35; e.x+=knx*kb; e.y+=kny*kb; }
  SFX.hit();
}
function killEnemy(i){
  const e=enemies[i], p=player;
  kills++; combo++; comboT=180; if(combo>bestCombo)bestCombo=combo;
  addScore(e.pts*(e.elite?1:1));
  if(p.lifesteal) p.hp=Math.min(p.maxHp,p.hp+p.lifesteal);
  const big=e.type==='boss';
  burst(e.x,e.y,e.col,big?60:e.elite?34:18,big?9:5,big?60:30);
  shake=Math.max(shake,big?14:e.elite?7:3.5); if(big)hitstop=Math.max(hitstop,8);
  big?SFX.boss():e.elite?SFX.elite():SFX.kill();
  // drops
  const heartChance=e.elite?.45:big?1:.045;
  if(Math.random()<heartChance) drops.push({x:e.x,y:e.y,type:'heart',life:700});
  else if(Math.random()<.22) drops.push({x:e.x,y:e.y,type:'ember',life:600});
  // splitter splits
  if(e.type==='splitter' && !e.child){
    spawnEnemy('crawler',e.x-14,e.y,true); spawnEnemy('crawler',e.x+14,e.y,true);
  }
  enemies.splice(i,1);
}

// ================= update =================
function update(){
  frame++;
  if(annT>0){ annT--; if(annT===0) $('announce').style.opacity=0; }
  for(let i=0;i<embers.length;i++){ const e=embers[i]; e.y-=e.s; e.x+=Math.sin((frame+e.y)*.01)*.3; if(e.y<-5){e.y=H+5;e.x=rnd(0,W);} }
  if(hitstop>0){ hitstop--; return; }
  if(state!=='play') return;
  const p=player;

  if(comboT>0){ comboT--; if(comboT===0) combo=0; }

  buildGrid();

  // --- player move ---
  let mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  let my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  const ml=Math.hypot(mx,my)||1;
  if(p.dashing>0){ p.dashing--; p.x+=p.dx*13; p.y+=p.dy*13;
    if(parts.length<PART_CAP) parts.push({x:p.x,y:p.y,vx:rnd(-1,1),vy:rnd(-1,1),life:18,max:18,col:'#ffae42',r:rnd(2,4)});
    if(p.nova && p.dashing===0){ burst(p.x,p.y,'#ff5e2b',28,7,35); shake=8; SFX.nova();
      const near=nearby(p.x,p.y,170);
      for(let i=0;i<near.length;i++){ const e=near[i];
        if(dist2(p,e)<170*170){ hurtEnemy(e,p.dmg*2.2,0,0,false); if(p.burn){e.burnT=120;} } } }
  } else { p.x+=mx/ml*p.spd; p.y+=my/ml*p.spd; }
  p.x=clamp(p.x,p.r,W-p.r); p.y=clamp(p.y,p.r,H-p.r);
  if(p.dashT>0)p.dashT--;
  if(keys.Space && p.dashT<=0 && (mx||my)){ p.dashing=9; p.dx=mx/ml; p.dy=my/ml; p.dashT=p.dashCd; p.inv=14; burst(p.x,p.y,'#ffe9c4',10,3,18); SFX.dash(); }
  if(p.inv>0)p.inv--;
  if(p.regen>0 && frame%120===0) p.hp=Math.min(p.maxHp,p.hp+p.regen);

  // --- orbiting anvils ---
  if(p.orbs>0){
    p.orbA+=.055;
    for(let k=0;k<p.orbs;k++){
      const a=p.orbA+k/p.orbs*TAU, ox=p.x+Math.cos(a)*58, oy=p.y+Math.sin(a)*58;
      const near=nearby(ox,oy,40);
      for(let i=0;i<near.length;i++){ const e=near[i];
        if(e.orbI<=0){ const rr=e.r+10;
          if(dist2({x:ox,y:oy},e)<rr*rr){ hurtEnemy(e,p.dmg*.9,Math.cos(a)*6,Math.sin(a)*6,false); e.orbI=22;
            if(p.burn)e.burnT=120; burst(ox,oy,'#ffae42',4,3,14); } } }
    }
  }

  // --- auto fire ---
  p.fireT--;
  if(p.fireT<=0 && enemies.length){
    p.fireT=p.fireRate;
    const ang=Math.atan2(mouse.y-p.y,mouse.x-p.x), spread=.13;
    for(let i=0;i<p.shots;i++){
      const off=(i-(p.shots-1)/2)*spread;
      bullets.push({x:p.x+Math.cos(ang)*14,y:p.y+Math.sin(ang)*14,
        vx:Math.cos(ang+off)*p.projSpd,vy:Math.sin(ang+off)*p.projSpd,
        life:80,pierce:p.pierce,bounce:p.ricochet,hit:new Set()});
    }
    burst(p.x+Math.cos(ang)*16,p.y+Math.sin(ang)*16,'#ffae42',2,2,10);
    shake=Math.max(shake,1); SFX.shoot();
  }

  // --- spawn queue (active cap keeps perf + pacing sane) ---
  if(spawnQueue.length && enemies.length<52){
    spawnT--; if(spawnT<=0){ spawnEnemy(spawnQueue.shift()); spawnT=Math.max(6,40-wave*2); }
  }

  // --- bullets ---
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if(b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){bullets.splice(i,1);continue;}
    const near=nearby(b.x,b.y,46);
    let consumed=false;
    for(let j=0;j<near.length;j++){ const e=near[j];
      if(b.hit.has(e)) continue;
      const rr=e.r+4;
      if(dist2(b,e)<rr*rr){
        const isCrit=Math.random()<p.crit;
        hurtEnemy(e,p.dmg*(isCrit?2.5:1),b.vx,b.vy,isCrit);
        if(p.burn) e.burnT=120;
        b.hit.add(e);
        burst(b.x,b.y,e.col,4,3,16);
        if(b.pierce>0){ b.pierce--; }
        else if(b.bounce>0){ b.bounce--;
          // ricochet: redirect to nearest unhit enemy
          let bestE=null,bd=300*300;
          for(let k=0;k<enemies.length;k++){ const o=enemies[k];
            if(b.hit.has(o))continue; const d=dist2(b,o); if(d<bd){bd=d;bestE=o;} }
          if(bestE){ const a2=Math.atan2(bestE.y-b.y,bestE.x-b.x), sp=Math.hypot(b.vx,b.vy);
            b.vx=Math.cos(a2)*sp; b.vy=Math.sin(a2)*sp; b.life=Math.max(b.life,40); }
          else { consumed=true; }
        }
        else { consumed=true; }
        break;
      }
    }
    if(consumed) bullets.splice(i,1);
  }

  // --- enemies ---
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];
    if(e.hitF>0)e.hitF--;
    if(e.orbI>0)e.orbI--;
    // burn DoT
    if(e.burnT>0){ e.burnT--;
      if(++e.burnTick>=20){ e.burnTick=0; e.hp-=p.dmg*.18; dnum(e.x,e.y-6,p.dmg*.18,'#ff5e2b');
        if(parts.length<PART_CAP)parts.push({x:e.x+rnd(-6,6),y:e.y+rnd(-6,6),vx:0,vy:-1,life:16,max:16,col:'#ff5e2b',r:2}); } }
    const ang=Math.atan2(p.y-e.y,p.x-e.x);
    if(e.type==='spitter'){
      const d=Math.sqrt(dist2(e,p)), want=d>270?1:d<210?-1:0;
      e.x+=Math.cos(ang)*e.spd*want; e.y+=Math.sin(ang)*e.spd*want;
      if(--e.fireT<=0){ e.fireT=rnd(80,130);
        if(ebullets.length<EBUL_CAP) ebullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*4.4,vy:Math.sin(ang)*4.4,r:5,dmg:e.dmg,life:200,col:'#4aa3b8'}); }
    } else if(e.type==='hound'){
      if(e.hstate===0){ // stalk
        e.x+=Math.cos(ang)*e.spd; e.y+=Math.sin(ang)*e.spd;
        if(--e.hT<=0 && dist2(e,p)<340*340){ e.hstate=1; e.hT=26; e.ca=ang; }
      } else if(e.hstate===1){ // windup (telegraph)
        e.hT--; e.ca=Math.atan2(p.y-e.y,p.x-e.x);
        if(e.hT<=0){ e.hstate=2; e.hT=22; SFX.dash(); }
      } else { // charge
        e.x+=Math.cos(e.ca)*9; e.y+=Math.sin(e.ca)*9; e.hT--;
        if(e.hT<=0){ e.hstate=0; e.hT=rnd(70,110); }
      }
    } else if(e.type==='boss'){
      if(e.hstate===1){ // charge windup
        e.hT--; e.ca=ang; if(e.hT<=0){e.hstate=2;e.hT=30;SFX.boss();}
      } else if(e.hstate===2){
        e.x+=Math.cos(e.ca)*7; e.y+=Math.sin(e.ca)*7; e.hT--;
        if(e.hT<=0)e.hstate=0;
      } else {
        e.x+=Math.cos(ang)*e.spd; e.y+=Math.sin(ang)*e.spd;
        if(--e.fireT<=0){
          e.fireT=clamp(105-wave*2,50,105); e.pat=(e.pat+1)%3;
          if(e.pat===0){ // ring
            const n=10+Math.floor(wave/5)*2, base=rnd(0,TAU);
            for(let k=0;k<n && ebullets.length<EBUL_CAP;k++){const a=base+k/n*TAU;
              ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,r:6,dmg:14,life:240,col:'#ff8c1a'});}
            shake=Math.max(shake,5);
          } else if(e.pat===1){ // aimed fan
            for(let k=-2;k<=2 && ebullets.length<EBUL_CAP;k++){const a=ang+k*.16;
              ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*4.6,vy:Math.sin(a)*4.6,r:6,dmg:14,life:220,col:'#ff8c1a'});}
          } else { e.hstate=1; e.hT=34; } // telegraph charge
        }
      }
    } else {
      e.x+=Math.cos(ang)*e.spd; e.y+=Math.sin(ang)*e.spd;
    }
    // separation via grid
    const near=nearby(e.x,e.y,e.r+24);
    for(let j=0;j<near.length;j++){ const o=near[j]; if(o===e)continue;
      const rr=(e.r+o.r)*.8;
      if(dist2(e,o)<rr*rr){ const a2=Math.atan2(e.y-o.y,e.x-o.x); e.x+=Math.cos(a2)*.5; e.y+=Math.sin(a2)*.5; } }
    // touch damage
    const rr=e.r+p.r;
    if(p.inv<=0 && p.dashing<=0 && dist2(e,p)<rr*rr){
      p.hp-=e.dmg; p.inv=40; shake=10; flash=8; hitstop=4; combo=0; SFX.hurt();
      burst(p.x,p.y,'#ff5e2b',14,5,26);
      const ka=Math.atan2(p.y-e.y,p.x-e.x); p.x+=Math.cos(ka)*22; p.y+=Math.sin(ka)*22;
    }
    if(e.hp<=0) killEnemy(i);
  }

  // --- enemy bullets ---
  for(let i=ebullets.length-1;i>=0;i--){const b=ebullets[i];
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){ebullets.splice(i,1);continue;}
    const rr=b.r+p.r;
    if(p.inv<=0 && p.dashing<=0 && dist2(b,p)<rr*rr){
      p.hp-=b.dmg; p.inv=35; shake=8; flash=6; combo=0; SFX.hurt();
      burst(p.x,p.y,b.col,10,4,22); ebullets.splice(i,1);
    }
  }

  // --- drops ---
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];
    d.life--; if(d.life<=0){drops.splice(i,1);continue;}
    const dd=dist2(d,p);
    if(dd<110*110){ const a=Math.atan2(p.y-d.y,p.x-d.x); const pull=clamp(2200/Math.sqrt(dd+1),1,7);
      d.x+=Math.cos(a)*pull; d.y+=Math.sin(a)*pull; }
    const rr=p.r+9;
    if(dd<rr*rr){
      if(d.type==='heart'){ p.hp=Math.min(p.maxHp,p.hp+12); dnum(p.x,p.y-14,12,'#7ee084'); SFX.heart(); }
      else { addScore(60); dnum(p.x,p.y-14,60,'#ffae42'); SFX.pickup(); }
      burst(d.x,d.y,d.type==='heart'?'#7ee084':'#ffae42',8,3,18);
      drops.splice(i,1);
    }
  }

  // --- particles / dnums ---
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.94;q.vy*=.94;q.life--;if(q.life<=0)parts.splice(i,1);}
  for(let i=dnums.length-1;i>=0;i--){const d=dnums[i];d.y-=.8;d.life--;if(d.life<=0)dnums.splice(i,1);}

  // --- wave clear / death ---
  if(waveActive && !spawnQueue.length && !enemies.length){
    waveActive=false;
    if(wave>best){ best=wave; try{localStorage.setItem('emberfall_best',best)}catch(e){} }
    addScore(100+wave*20);
    setTimeout(offerUpgrades,500);
  }
  if(p.hp<=0){ p.hp=0; gameOver(); }

  // --- HUD ---
  $('hpfill').style.width=(p.hp/p.maxHp*100)+'%';
  $('hptext').textContent=Math.ceil(p.hp)+' / '+p.maxHp;
  $('dashfill').style.width=(100-100*p.dashT/p.dashCd)+'%';
  $('kills').textContent=kills;
  $('score').textContent=score.toLocaleString();
  $('waveLeft').textContent=(spawnQueue.length+enemies.length)+' REMAIN';
  $('best').textContent=best?('BEST W'+best):'';
  $('combo').textContent = combo>5 ? (combo+'× COMBO · '+(1+Math.floor(combo/8))+'× SCORE') : '';
}

function gameOver(){
  state='over';
  burst(player.x,player.y,'#ffae42',60,8,60); shake=16; SFX.over();
  if(score>bestScore){ bestScore=score; try{localStorage.setItem('emberfall_bestscore',bestScore)}catch(e){} }
  $('fWaves').textContent=wave; $('fKills').textContent=kills;
  $('fScore').textContent=score.toLocaleString(); $('fCombo').textContent=bestCombo+'×';
  $('fBest').innerHTML = (wave>=best?'<b style="color:var(--ember)">NEW BEST WAVE</b> · ':'Best: <b>W'+best+'</b> · ')+'Top score: <b>'+bestScore.toLocaleString()+'</b>';
  show('hud',false); setTimeout(()=>show('overUI',true),600);
}

// ================= draw =================
function draw(){
  ctx.save();
  if(shake>0){ ctx.translate(rnd(-shake,shake),rnd(-shake,shake)); shake*=.85; if(shake<.3)shake=0; }

  // floor
  ctx.fillStyle='#15110c'; ctx.fillRect(-20,-20,W+40,H+40);
  ctx.strokeStyle='rgba(255,174,66,.04)'; ctx.lineWidth=1;
  const g=64; ctx.beginPath();
  for(let x=g;x<W;x+=g){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(let y=g;y<H;y+=g){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();
  const rg=ctx.createRadialGradient(W/2,H/2,80,W/2,H/2,Math.max(W,H)*.7);
  rg.addColorStop(0,'rgba(255,110,40,.06)'); rg.addColorStop(1,'rgba(0,0,0,.35)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);

  // ambient embers
  ctx.fillStyle='#ffae42';
  for(let i=0;i<embers.length;i++){ const e=embers[i];
    ctx.globalAlpha=e.o; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,TAU); ctx.fill(); }
  ctx.globalAlpha=1;

  if(state==='menu'){ ctx.restore(); return; }
  const p=player;

  // ---- glow pass (additive, sprite-based: cheap) ----
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<drops.length;i++){ const d=drops[i];
    drawGlow(d.type==='heart'?'#7ee084':'#ffae42',12,d.x,d.y); }
  for(let i=0;i<ebullets.length;i++){ const b=ebullets[i]; drawGlow(b.col,b.r+5,b.x,b.y); }
  for(let i=0;i<enemies.length;i++){ const e=enemies[i]; drawGlow(e.col,Math.round(e.r*.9),e.x,e.y); }
  for(let i=0;i<bullets.length;i++){ const b=bullets[i]; drawGlow('#ffae42',7,b.x,b.y); }
  drawGlow('#ffae42',p.dashing>0?26:16,p.x,p.y);
  ctx.globalCompositeOperation='source-over';

  // drops core
  for(let i=0;i<drops.length;i++){ const d=drops[i];
    const bob=Math.sin(frame*.1+i)*2;
    if(d.type==='heart'){ ctx.fillStyle='#7ee084';
      ctx.beginPath(); ctx.arc(d.x-3,d.y+bob-2,3.4,0,TAU); ctx.arc(d.x+3,d.y+bob-2,3.4,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(d.x-6,d.y+bob-1); ctx.lineTo(d.x,d.y+bob+7); ctx.lineTo(d.x+6,d.y+bob-1); ctx.fill();
    } else { ctx.fillStyle='#ffae42';
      ctx.beginPath(); ctx.moveTo(d.x,d.y+bob-6); ctx.lineTo(d.x+5,d.y+bob); ctx.lineTo(d.x,d.y+bob+6); ctx.lineTo(d.x-5,d.y+bob); ctx.closePath(); ctx.fill(); }
  }

  // enemy bullets core
  for(let i=0;i<ebullets.length;i++){ const b=ebullets[i];
    ctx.fillStyle=b.col; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); }

  // enemies
  for(let i=0;i<enemies.length;i++){ const e=enemies[i];
    const hit=e.hitF>0;
    ctx.fillStyle=hit?'#ffffff':e.col;
    ctx.beginPath();
    if(e.type==='brute'||e.type==='boss'||e.type==='splitter'){
      const n=7; ctx.moveTo(e.x+e.r,e.y);
      for(let k=1;k<=n;k++){const a=k/n*TAU,rr=e.r*(.82+.18*Math.sin(k*7+frame*.05));
        ctx.lineTo(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr);}
    } else if(e.type==='spitter'){
      ctx.moveTo(e.x,e.y-e.r);ctx.lineTo(e.x+e.r,e.y);ctx.lineTo(e.x,e.y+e.r);ctx.lineTo(e.x-e.r,e.y);
    } else if(e.type==='hound'){
      const a=e.hstate===2?e.ca:Math.atan2(p.y-e.y,p.x-e.x);
      ctx.moveTo(e.x+Math.cos(a)*e.r*1.4,e.y+Math.sin(a)*e.r*1.4);
      ctx.lineTo(e.x+Math.cos(a+2.5)*e.r,e.y+Math.sin(a+2.5)*e.r);
      ctx.lineTo(e.x+Math.cos(a-2.5)*e.r,e.y+Math.sin(a-2.5)*e.r);
    } else { ctx.arc(e.x,e.y,e.r,0,TAU); }
    ctx.closePath(); ctx.fill();
    // dark core
    ctx.fillStyle='rgba(21,17,12,.7)';
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r*.42,0,TAU); ctx.fill();
    // burn marker
    if(e.burnT>0){ ctx.strokeStyle='rgba(255,94,43,.85)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r*.62,0,TAU); ctx.stroke(); }
    // elite ring
    if(e.elite){ ctx.strokeStyle='rgba(255,233,196,.9)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r+5,0,TAU); ctx.stroke(); }
    // windup telegraph (hound + boss charge)
    if((e.type==='hound'&&e.hstate===1)||(e.type==='boss'&&e.hstate===1)){
      ctx.strokeStyle=`rgba(255,210,63,${.4+.4*Math.sin(frame*.6)})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(e.x,e.y);
      ctx.lineTo(e.x+Math.cos(e.ca)*120,e.y+Math.sin(e.ca)*120); ctx.stroke();
    }
    // boss hp bar
    if(e.type==='boss'){
      ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(e.x-44,e.y-e.r-16,88,7);
      ctx.fillStyle='#ff8c1a'; ctx.fillRect(e.x-44,e.y-e.r-16,88*Math.max(0,e.hp/e.maxHp),7);
    }
  }

  // player bullets (batched stroke)
  ctx.strokeStyle='#ffe9c4'; ctx.lineWidth=3; ctx.beginPath();
  for(let i=0;i<bullets.length;i++){ const b=bullets[i];
    ctx.moveTo(b.x-b.vx*1.4,b.y-b.vy*1.4); ctx.lineTo(b.x,b.y); }
  ctx.stroke();

  // orbiting anvils
  if(p.orbs>0){
    for(let k=0;k<p.orbs;k++){
      const a=p.orbA+k/p.orbs*TAU, ox=p.x+Math.cos(a)*58, oy=p.y+Math.sin(a)*58;
      ctx.globalCompositeOperation='lighter'; drawGlow('#ffae42',10,ox,oy); ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#ffe9c4'; ctx.save(); ctx.translate(ox,oy); ctx.rotate(a);
      ctx.fillRect(-7,-5,14,10); ctx.fillRect(-4,5,8,3); ctx.restore();
    }
    ctx.strokeStyle='rgba(255,174,66,.12)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(p.x,p.y,58,0,TAU); ctx.stroke();
  }

  // particles (alpha-bucketed-ish, simple)
  for(let i=0;i<parts.length;i++){ const q=parts[i];
    ctx.globalAlpha=q.life/q.max; ctx.fillStyle=q.col;
    ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,TAU); ctx.fill(); }
  ctx.globalAlpha=1;

  // player
  if(state!=='over'){
    const blink = p.inv>0 && Math.floor(frame/4)%2===0;
    if(!blink){
      const ang=Math.atan2(mouse.y-p.y,mouse.x-p.x);
      ctx.fillStyle='#ffe9c4'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
      ctx.fillStyle='#ff5e2b'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*.55,0,TAU); ctx.fill();
      ctx.strokeStyle='#ffae42'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(p.x+Math.cos(ang)*p.r,p.y+Math.sin(ang)*p.r);
      ctx.lineTo(p.x+Math.cos(ang)*(p.r+10),p.y+Math.sin(ang)*(p.r+10)); ctx.stroke();
      if(p.dashT<=0){ ctx.strokeStyle='rgba(255,233,196,.5)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r+6,0,TAU); ctx.stroke(); }
    }
  }

  // damage numbers
  ctx.textAlign='center';
  for(let i=0;i<dnums.length;i++){ const d=dnums[i];
    ctx.globalAlpha=d.life/40; ctx.fillStyle=d.col;
    ctx.font=(d.big?'bold 17px':'bold 13px')+' "JetBrains Mono",monospace';
    ctx.fillText(d.v,d.x,d.y); }
  ctx.globalAlpha=1;

  // damage flash + vignette
  if(flash>0){ ctx.fillStyle=`rgba(255,60,20,${flash*.03})`; ctx.fillRect(0,0,W,H); flash--; }
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  if(state==='pause'){
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffae42'; ctx.font='800 36px Cinzel,serif'; ctx.textAlign='center';
    ctx.fillText('PAUSED',W/2,H/2-10);
    ctx.fillStyle='#8a8077'; ctx.font='12px "JetBrains Mono",monospace';
    ctx.fillText('P resume · M '+(muted?'unmute':'mute'),W/2,H/2+22);
  }
  ctx.restore();
}

// ================= loop =================
function loop(){
  update(); draw();
  // fps meter (debug-lite, bottom-left)
  const now=performance.now(); fpsAcc+=1000/(now-fpsLast||16); fpsLast=now; fpsN++;
  if(fpsN>=30){ fps=Math.round(fpsAcc/fpsN); fpsAcc=0; fpsN=0;
    if(state==='play'){ show('fpsTag',true); $('fpsTag').textContent=fps+' FPS · '+enemies.length+' SLAG · '+(bullets.length+ebullets.length)+' PROJ'; }
    else show('fpsTag',false);
  }
  requestAnimationFrame(loop);
}

$('startBtn').onclick=()=>{ audioInit(); show('menu',false); show('hud',true); reset(); state='play'; };
$('againBtn').onclick=()=>{ audioInit(); show('overUI',false); show('hud',true); reset(); state='play'; };

loop();
})();
</script>
